name: Feature Request
description: Suggest a new feature or enhancement for mcp.zig
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe the problem it solves before the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What limitation or pain point does this address?
      placeholder: "I cannot ... because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include API sketches if possible
      placeholder: |
        ```zig
        try server.addSomething(.{ .name = "..." });
        ```
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Server
        - Client
        - Transport (STDIO)
        - Transport (HTTP / httpx.zig)
        - Protocol / JSON-RPC
        - Tools / Resources / Prompts
        - Middleware / Utils
        - Example
        - Documentation
        - Build / CI
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried
    validations:
      required: false
  - type: textarea
    id: spec
    attributes:
      label: Spec impact
      description: Does this change MCP protocol behavior (2026-07-28)? If yes, how is compatibility preserved?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for similar requests
          required: true
        - label: I am willing to help implement or test this
          required: false
